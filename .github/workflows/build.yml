name: Build RT Module

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Driver
        uses: actions/checkout@v4
        with:
          path: driver

      - name: Checkout Kernel
        uses: actions/checkout@v4
        with:
          repository: Mantii04/dragonheart_kernel_motorola_cancunf
          ref: android12-5.10
          path: kernel
          fetch-depth: 1

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison build-essential flex libssl-dev libelf-dev gcc-aarch64-linux-gnu cpio clang lld llvm

      - name: Build Module
        run: |
          cd kernel
          export ARCH=arm64
          export LLVM=1
          export LLVM_IAS=1
          make gki_defconfig
          make modules_prepare
          make M=$GITHUB_WORKSPACE/driver modules 2>&1 | tail -150

      - name: Locate .ko
        run: |
          echo "=== Search for .ko ==="
          find $GITHUB_WORKSPACE -name "*.ko" -type f 2>/dev/null
          ls -la $GITHUB_WORKSPACE/driver/

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: memkernel
          path: |
            driver/memkernel.ko
            driver/*.ko
          if-no-files-found: error
