name: Build RT Module

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Driver
        uses: actions/checkout@v4
        with:
          path: driver

      - name: Checkout Kernel
        uses: actions/checkout@v4
        with:
          repository: Mantii04/dragonheart_kernel_motorola_cancunf
          ref: android12-5.10
          path: kernel
          fetch-depth: 1

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison build-essential flex libssl-dev libelf-dev gcc-aarch64-linux-gnu cpio clang lld llvm

      - name: Configure (dragonheart_defconfig + LOCALVERSION=-DragonHeart)
        run: |
          cd kernel
          export ARCH=arm64 LLVM=1 LLVM_IAS=1
          # Match the ROM's defconfig exactly
          make dragonheart_defconfig
          # Set localversion to match what's on the phone
          ./scripts/config --set-str CONFIG_LOCALVERSION "-DragonHeart"
          # LTO off only to avoid OOM on GitHub runner (does NOT affect symbol CRCs)
          ./scripts/config --disable LTO_CLANG_FULL
          ./scripts/config --disable LTO_CLANG_THIN
          ./scripts/config --disable LTO_CLANG
          make olddefconfig
          # Confirm the settings stuck
          grep -E "CONFIG_LOCALVERSION=|CONFIG_LTO" .config

      - name: Get kernel commit SHA
        id: kernel-sha
        run: echo "sha=$(cd kernel && git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Cache Module.symvers
        id: cache-symvers
        uses: actions/cache@v4
        with:
          path: kernel/Module.symvers
          key: symvers-${{ steps.kernel-sha.outputs.sha }}-dragonheart-${{ hashFiles('kernel/.config') }}

      - name: Prepare headers
        run: |
          cd kernel
          export ARCH=arm64 LLVM=1 LLVM_IAS=1
          make modules_prepare

      - name: Build vmlinux (cache miss only)
        if: steps.cache-symvers.outputs.cache-hit != 'true'
        run: |
          cd kernel
          export ARCH=arm64 LLVM=1 LLVM_IAS=1
          make -j$(nproc) vmlinux
          cp vmlinux.symvers Module.symvers

      - name: Verify Module.symvers
        run: |
          ls -la kernel/Module.symvers
          echo "=== Sample CRCs ==="
          grep -E "module_layout|register_user_hw_breakpoint" kernel/Module.symvers | head

      - name: Build Module
        run: |
          cd kernel
          export ARCH=arm64 LLVM=1 LLVM_IAS=1
          make M=$GITHUB_WORKSPACE/driver modules 2>&1 | tee module-build.log

      - name: Fail only on real CRC/symbol warnings
        run: |
          cd kernel
          if grep -E 'WARNING: Symbol version dump|Unresolved symbol|disagrees about version' module-build.log; then
            echo "CRC/symbol problem detected!"
            exit 1
          else
            echo "No CRC/symbol warnings - OK"
          fi

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: memkernel
          path: driver/*.ko
          if-no-files-found: error
